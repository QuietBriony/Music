<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local take review verification</title><link rel="stylesheet" href="../../src/vocal-booth.css">
<style>body{background:#141119;color:#eee;font-family:system-ui;margin:12px}button{min-height:44px}pre{white-space:pre-wrap}</style>
<h1>Local take review verification</h1>
<p>ローカル専用。マイクを開かず、140 Hzの演奏と700 Hzの疑似声を生成して端末棚へ保存します。</p>
<button id="fixture-create">3系統のテストテイクを作る</button><pre id="fixture-status">Ready</pre><main></main>
<script type="module">
import {initVocalBooth} from '../../src/vocal-booth.js';
import {VocalRecorder} from '../../src/vocal-recorder.js';
import {openTakeStore} from '../../src/vocal-store.js';
const session={strudel:{drafts:[],levels:{},decks:{}},acidbros:{files:[]}};
let stopped=0;
const booth=initVocalBooth({parent:document.querySelector('main'),getSources:()=>[],snapshot:()=>session,
  stopPlayback:()=>{document.querySelector('#fixture-status').textContent='試聴で演奏を停止: '+(++stopped);}});
booth.open();
document.querySelector('#fixture-create').onclick=async()=>{
  const button=document.querySelector('#fixture-create'),status=document.querySelector('#fixture-status');button.disabled=true;
  const ctx=new AudioContext();await ctx.resume();const oscillators=[];
  const tone=frequency=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=frequency;gain.gain.value=.08;
    osc.connect(gain);osc.start();oscillators.push(osc);return gain;};
  const backing=tone(140),voice=tone(700),input=ctx.createMediaStreamDestination();voice.connect(input);
  const recorder=new VocalRecorder({getSources:()=>[backing],Recorder:MediaRecorder,mediaDevices:{getUserMedia:async()=>input.stream}});
  try {
    status.textContent='合成音を3秒録音中…';await recorder.arm();
    recorder.start({metadata:{title:'3系統の試聴テスト',lyrics:'テスト用メモ',session}});
    await new Promise(resolve=>setTimeout(resolve,3000));const take=await recorder.stop();
    await openTakeStore(indexedDB).put(take);document.querySelector('#vocal-refresh').click();
    status.textContent='保存済み: mix / voice / backing。聴く音を切替 → 試聴 → 棚を更新して位置と音が保たれることを確認。';
  } catch(error) {status.textContent='FAIL '+error.message;}
  finally {recorder.disarm();oscillators.forEach(osc=>osc.stop());await ctx.close();button.disabled=false;}
};
</script></html>
